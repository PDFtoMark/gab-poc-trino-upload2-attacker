name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          cat > out/TEST-evil.xml <<'XML'
          <testsuite name="attacker" tests="1" failures="0">
            <testcase name="ATTACKER-CONTROLLED-ROW" classname="io.trino.Fake" time="0.001"/>
            <properties><property name="not-a-real-test" value="1"/></properties>
          </testsuite>
          XML
      - uses: actions/upload-artifact@v7
        with:
          name: test report attacker
          path: out/TEST-*.xml
